onboarding = false

[theme]
name = "rose-pine"

[ui.toast]
delivery = "system"

[ui]
agent_panel_scope = "all"
agent_panel_sort = "priority"
hide_tab_bar_when_single_tab = true
mouse_capture = false
sidebar_collapsed_mode = "hidden"

# Section headings (Spaces / Agents) are not configurable in Herdr 0.9.1;
# these layouts only control the entries below them.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", fg = "__HERDR_BRANCH_COLOR__" }],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["state_text", { token = "agent", fg = "__HERDR_AGENT_COLOR__" }],
]

[keys]
# Use direct macOS shortcuts for common workspace, tab, and pane actions.
new_workspace = "cmd+ctrl+n"
new_worktree = ""
open_worktree = "prefix+o"
toggle_sidebar = "cmd+s"
new_tab = "cmd+t"
close_pane = "cmd+w"
split_vertical = "cmd+d"
split_horizontal = "cmd+shift+d"
copy_mode = "cmd+shift+c"
edit_scrollback = "cmd+shift+e"

# Preserve the existing Vim-style Ghostty navigation and resize chords rather
# than adopting the guide's bracket-based pane cycling.
focus_pane_left = "cmd+ctrl+h"
focus_pane_down = "cmd+ctrl+j"
focus_pane_up = "cmd+ctrl+k"
focus_pane_right = "cmd+ctrl+l"
resize_pane_left = "cmd+ctrl+alt+h"
resize_pane_down = "cmd+ctrl+alt+j"
resize_pane_up = "cmd+ctrl+alt+k"
resize_pane_right = "cmd+ctrl+alt+l"

[[keys.command]]
key = "cmd+k"
type = "plugin_action"
command = "herdr.project-picker.open"
description = "Projects: open bookmarked project"

[[keys.command]]
key = "cmd+shift+n"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch or create from the default branch"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "herdr-open-wt"
description = "Open all linked worktree checkouts in this space"
